<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Interativo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0f12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Moldura estilo smartphone com borda em gradiente */
        .phone-frame {
            width: 100%;
            max-width: 380px;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .phone-screen {
            background: #1a0505;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho do Post */
        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
            color: #ffffff;
        }

        .more-options {
            cursor: pointer;
            color: #eff3f8;
        }

        /* Mídia / Foto */
        .post-media {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            background-color: #eee;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        .post-media img.main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Coração animado sobreposto na foto */
        .heart-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90px;
            height: 90px;
            fill: #ef4444;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        .heart-overlay.animate {
            animation: heartPop 0.75s ease-in-out forwards;
        }

        @keyframes heartPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            20% {
                transform: translate(-50%, -50%) scale(1.25);
                opacity: 0.95;
            }

            40% {
                transform: translate(-50%, -50%) scale(0.95);
                opacity: 1;
            }

            60% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0;
            }
        }

        /* Avatar pequeno com ícone '+' sobreposto na foto */
        .user-badge {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 44px;
            height: 44px;
        }

        .user-badge img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #fffbfb;
            object-fit: cover;
        }

        .user-badge .plus-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #561296;
            color: rgb(18, 5, 5);
            font-size: 10px;
            font-weight: bold;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
        }

        /* Ações (Curtir, Comentar, Repostar, Direct, Salvar) */
        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 8px 16px;
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Detalhes do texto de curtidas */
        .post-details {
            padding: 0 16px 12px 16px;
            font-size: 13px;
            color: #e0e5ec;
        }

        .likes {
            color: #e8ebef;
        }

        .likes strong {
            color: #ffffff;
        }

        /* Barra de Navegação Inferior */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 16px 0;
            border-top: 1px solid #110f0f;
            background: #131010;
        }

        .nav-item {
            color: #e5e8ee;
            cursor: pointer;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* --- Estado Curtido --- */
        .action-btn.liked {
            color: #ef4444;
        }

        .action-btn.liked svg {
            fill: #ef4444;
            stroke: #ef4444;
            transform: scale(1.15);
        }
    </style>
</head>

<body>

    <div class="phone-frame">
        <div class="phone-screen">

            <div class="post-header">
                <div class="user-info">
                    <img src="https://picsum.photos/100/100" alt="Avatar" class="avatar-small">
                    <span class="username">dev_infinity</span>
                </div>
                <span class="more-options">&#8942;</span>
            </div>

            <div class="post-media">
                <img src="https://picsum.photos/400/500" alt="Foto do Post" class="main-img">

                <svg class="heart-overlay" viewBox="0 0 24 24">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>

                <div class="user-badge">
                    <img src="https://picsum.photos/100/100" alt="Badge">
                    <span class="plus-icon">+</span>
                </div>
            </div>

            <div class="post-actions">
                <div class="left-actions">
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="post-details">
                <p class="likes">Curtido por <strong>0 pessoas</strong></p>
            </div>

            <div class="nav-bar">
                <div class="nav-item">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                </div>
            </div>

        </div>
    </div>

    <script>
        let count = 0;

        const likeBtn = document.querySelector('.action-btn');
        const postMedia = document.querySelector('.post-media');
        const likesText = document.querySelector('.likes');
        const heartOverlay = document.querySelector('.heart-overlay');

        function handleLike() {
            count++;

            likesText.innerHTML = `Curtido por <strong>${count.toLocaleString()} pessoas</strong>`;

            likeBtn.classList.add('liked');

            if (heartOverlay) {
                heartOverlay.classList.remove('animate');
                void heartOverlay.offsetWidth;
                heartOverlay.classList.add('animate');
            }
        }

        likeBtn.addEventListener('click', handleLike);
        postMedia.addEventListener('dblclick', handleLike);
    </script>
</body>

</html>
