<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Social Media</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #0d0f12;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Moldura estilo smartphone com borda em gradiente */
.phone-frame {
    width: 100%;
    max-width: 380px;
    border-radius: 40px;
    padding: 8px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
}

.phone-screen {
    background: #1a0505;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* Cabeçalho do Post */
.post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar-small {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
}

.username {
    font-weight: 600;
    font-size: 14px;
    color: #ffffff;
}

.more-options {
    cursor: pointer;
    color: #eff3f8;
}

/* Mídia / Foto */
.post-media {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background-color: #eee;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
}

.post-media img.main-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Coração animado sobreposto na foto */
.heart-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 90px;
    height: 90px;
    fill: #ef4444;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
}

.heart-overlay.animate {
    animation: heartPop 0.75s ease-in-out forwards;
}

@keyframes heartPop {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    20% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 0.95;
    }
    40% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 1;
    }
    60% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0;
    }
}

/* Avatar pequeno com ícone '+' sobreposto na foto */
.user-badge {
    position: absolute;
    bottom: 16px;
    left: 16px;
    width: 44px;
    height: 44px;
}

.user-badge img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid #fffbfb;
    object-fit: cover;
}

.user-badge .plus-icon {
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: #561296;
    color: rgb(18, 5, 5);
    font-size: 10px;
    font-weight: bold;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffffff;
}

/* Ações (Curtir, Comentar, Repostar, Direct, Salvar) */
.post-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px 16px;
}

.left-actions {
    display: flex;
    align-items: center;
    gap: 14px;
}

.action-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    cursor: pointer;
    background: none;
    border: none;
    outline: none;
}

.action-btn svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Detalhes do texto de curtidas */
.post-details {
    padding: 0 16px 12px 16px;
    font-size: 13px;
    color: #e0e5ec;
}

.likes {
    color: #e8ebef;
}

.likes strong {
    color: #ffffff;
}

/* Barra de Navegação Inferior */
.nav-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0 16px 0;
    border-top: 1px solid #110f0f;
    background: #131010;
}

.nav-item {
    color: #e5e8ee;
    cursor: pointer;
}

.nav-item svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

/* --- Estado Curtido --- */
.action-btn.liked {
    color: #ef4444;
}

.action-btn.liked svg {
    fill: #ef4444;
    stroke: #ef4444;
    transform: scale(1.15);
}

</style>
</head>

<body>

    <div class="phone-frame">
        <div class="phone-screen">

            <!-- Cabeçalho do Post -->
            <div class="post-header">
                <div class="user-info">
                    <img class="avatar-small"
                        src="https://media.wired.com/photos/5f75cdbbb5fbbbb0ed6d44b3/1:1/w_1600,h_1600,c_limit/Culture_NBAFinals_1228816794.jpg"
                        alt="Avatar">
                    <span class="username">Unknown37</span>
                </div>
                <div class="more-options">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="5" cy="12" r="2" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="19" cy="12" r="2" />
                    </svg>
                </div>
            </div>

            <!-- Mídia Principal (Clique ou duplo clique para curtir) -->
            <div class="post-media">
                <img class="main-img" src="https://upload.wikimedia.org/wikipedia/en/b/bb/You_Season_2.jpg"
                    alt="Post photo">

                <!-- Coração animado sobreposto na foto -->
                <svg class="heart-overlay" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>

                <!-- Sticker/Badge sobreposto na foto -->
                <div class="user-badge">
                    <img src="https://variety.com/wp-content/uploads/2023/03/resident-evil.webp?w=1000&h=667&crop=1"
                        alt="User overlay">
                    <div class="plus-icon">+</div>
                </div>
            </div>

            <!-- Barra de Interações -->
            <div class="post-actions">
                <div class="left-actions">
                    <!-- Botão de Curtida com contador iniciando em 0 -->
                    <button class="action-btn" id="like-button">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                        <span class="like-count">0</span>
                    </button>

                    <button class="action-btn">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                            </path>
                        </svg>
                        57
                    </button>

                    <button class="action-btn">
                        <svg viewBox="0 0 24 24">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                        24
                    </button>

                    <button class="action-btn">
                        <svg viewBox="0 0 24 24">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        6
                    </button>
                </div>

                <button class="action-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
            </div>

            <!-- Detalhes / Curtidas -->
            <div class="post-details">
                <p class="likes">Seja o primeiro a curtir</p>
            </div>

            <!-- Navegação Inferior -->
            <div class="nav-bar">
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>

        </div>
    </div>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const likeBtn = document.getElementById("like-button");
    const likeCountSpan = likeBtn ? likeBtn.querySelector(".like-count") : null;
    const postMedia = document.querySelector(".post-media");
    const likesText = document.querySelector(".post-details .likes");
    const heartOverlay = document.querySelector(".heart-overlay");

    // Variáveis de controle do contador (INICIA RIGOROSAMENTE EM 0)
    let isLiked = false;
    let count = 0;

    // Atualiza toda a interface com base no número atual de curtidas
    function updateUI() {
        if (likeCountSpan) {
            likeCountSpan.textContent = count;
        }

        if (likeBtn) {
            if (isLiked) {
                likeBtn.classList.add("liked");
            } else {
                likeBtn.classList.remove("liked");
            }
        }

        if (likesText) {
            if (isLiked) {
                if (count === 1) {
                    likesText.innerHTML = 'Curtido por <strong>você</strong>';
                } else {
                    likesText.innerHTML = `Curtido por <strong>você</strong> e <strong>outras ${count - 1} pessoas</strong>`;
                }
            } else {
                if (count === 0) {
                    likesText.innerHTML = 'Seja o primeiro a curtir';
                } else {
                    likesText.innerHTML = `Curtido por <strong>${count} pessoas</strong>`;
                }
            }
        }
    }

    // Exibe o coração animado flutuando na imagem
    function triggerHeartAnimation() {
        if (!heartOverlay) return;
        heartOverlay.classList.remove("animate");
        void heartOverlay.offsetWidth; // Força re-render para reiniciar a animação CSS
        heartOverlay.classList.add("animate");
    }

    // Alterna o estado de curtida (+1 ou -1)
    function toggleLike(forceLike = false) {
        if (forceLike) {
            if (!isLiked) {
                isLiked = true;
                count += 1;
                triggerHeartAnimation();
            } else {
                triggerHeartAnimation(); // Dispara animação se já estiver curtido
            }
        } else {
            if (isLiked) {
                isLiked = false;
                count -= 1;
            } else {
                isLiked = true;
                count += 1;
                triggerHeartAnimation();
            }
        }
        updateUI();
    }

    // Clique no Botão de Curtida
    if (likeBtn) {
        likeBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleLike(false);
        });
    }

    // Clique / Duplo clique na Imagem Principal
    if (postMedia) {
        let clickTimer = null;

        postMedia.addEventListener("click", (e) => {
            if (e.target.closest(".user-badge")) return; // Ignora clique na foto do usuário

            if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    // Clique simples alterna a curtida
                    toggleLike(false);
                }, 250);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                // Duplo clique garante a curtida + animação grande do coração
                toggleLike(true);
            }
        });
    }

    // Força a renderização inicial com 0 curtidas
    updateUI();
});

</script>
</body>

</html>
